name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canalproart
          POSTGRES_PASSWORD: canalproart
          POSTGRES_DB: canalproart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canalproart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://canalproart:canalproart@localhost:5432/canalproart?schema=public

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://canalproart:canalproart@localhost:5432/canalproart?schema=public
          JWT_SECRET: ci-test-only-secret-not-used-anywhere-else-0123456789
          TOKEN_ENCRYPTION_KEY: 21f43b98d9aca5d34192b85b2383ca46bed2ba792ea1de01491ad8dd904d55ad
          YOUTUBE_CLIENT_ID: ci-test-only-client-id
          YOUTUBE_CLIENT_SECRET: ci-test-only-client-secret
          YOUTUBE_REDIRECT_URI: http://localhost:3000/api/youtube/callback
          YOUTUBE_API_KEY: ci-test-only-api-key

      - name: Build
        run: npm run build
