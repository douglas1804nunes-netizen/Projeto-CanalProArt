services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-canalproart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canalproart}
      POSTGRES_DB: ${POSTGRES_DB:-canalproart}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canalproart}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
